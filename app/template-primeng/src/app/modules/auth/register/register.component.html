
<div class="scalein animation-duration-500 h-full w-full m-0 py-4 px-4">
    <div class="text-center mb-5">
        <div class="text-900 text-3xl font-medium mb-3">
            {{ 'modules.auth.register.title-register' | translate }}
        </div>
    </div>

    <div class="w-full md:w-10 mx-auto">


        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-id-card"></i></span>
                <input type="text" placeholder="Nombre" pInputText styleClass="w-full" class="p-inputtext-lg"
                [(ngModel)]="registerForm.name.val" #name="ngModel">
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.name.isValid())">
                <small class="p-error block">{{ registerForm.name.error }}</small>
            </div>
        </div>

        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-id-card"></i></span>
                <input type="text" placeholder="Apellido Paterno" pInputText styleClass="w-full" class="p-inputtext-lg"
                [(ngModel)]="registerForm.last_name_father.val" #last_name_father="ngModel">
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.last_name_father.isValid())">
                <small class="p-error block">{{ registerForm.last_name_father.error }}</small>
            </div>
        </div>

        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-id-card"></i></span>
                <input type="text" placeholder="Apellido Materno" pInputText styleClass="w-full" class="p-inputtext-lg"
                [(ngModel)]="registerForm.last_name_mother.val" #last_name_mother="ngModel">
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.last_name_mother.isValid())">
                <small class="p-error block">{{ registerForm.last_name_mother.error }}</small>
            </div>
        </div>


        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-at"></i></span>
                <input type="text" placeholder="Correo" pInputText styleClass="w-full" class="p-inputtext-lg" autocomplete="off"
                [(ngModel)]="registerForm.email.val" #email="ngModel">
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.email.isValid())">
                <small class="p-error block">{{ registerForm.email.error }}</small>
            </div>
        </div>



        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
                <input type="text" placeholder="Usuario" pInputText styleClass="w-full" class="p-inputtext-lg"
                [(ngModel)]="registerForm.user.val" #user="ngModel">
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.user.isValid())">
                <small class="p-error block">{{ registerForm.user.error }}</small>
            </div>
        </div>


        <div class="mb-3">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-lock"></i></span>
                <p-password [toggleMask]="true" placeholder="clave" styleClass="w-full" class="p-inputtext-lg" autocomplete="off"
                [(ngModel)]="registerForm.password.val" #password="ngModel">
                </p-password>
            </div>
            <div class="p-inputgroup mb-2" *ngIf="(send && !registerForm.password.isValid())">
                <small class="p-error block">{{ registerForm.password.error }}</small>
            </div>
        </div>

        
        <div class="p-inputgroup mb-2" *ngIf="message != ''">
            <small class="p-error block">{{ message }}</small>
        </div>

        <div class="flex align-items-center justify-content-between mb-5 mt-2">
            <a class="font-medium no-underline ml-2 text-right cursor-pointer" (click)="goToEnterForm()">Volver</a>
        </div>
        <button pButton pRipple label="Crear" class="w-full p-3 text-xl" (click)="create()"></button>
    </div>
</div>
