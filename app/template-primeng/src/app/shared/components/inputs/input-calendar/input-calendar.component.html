
<div class="p-fluid">
    <div class="field" *ngIf="!floatLabel">
        <label>
            {{ label }}
        </label>
        <span class="p-input-icon-right">
            <p-calendar
            [inputId]="id"
            [(ngModel)]="ngModel"
            (onBlur)="onBlur.emit($event);"
            dateFormat="dd/mm/yy"
            [showClear]="showClear"
            (ngModelChange)="ngModelChange.emit($event)">
            </p-calendar>
            <i class="pi pi-calendar"></i>
        </span>
    </div>
