<p-dialog
  header="REGISTRAR MIEMBRO DEL EQUIPO"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '40rem' }"
  (onShow)="resetState()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (banner(); as current) {
      <p-message [severity]="current.severity" styleClass="mb-3">{{ current.message }}</p-message>
    }

    <div class="p-fluid mb-3">
      <label for="name" class="block font-bold">NOMBRE (*)</label>
      <input
        pInputText
        id="name"
        formControlName="name"
        placeholder="Ej: Ana Torres"
        autocomplete="off"
        autofocus
        [class.ng-invalid]="nameError()"
        [class.ng-dirty]="nameError()"
      />
      @if (nameError(); as message) {
        <small class="p-error block">{{ message }}</small>
      }
    </div>

    <div class="p-fluid mb-3">
      <label for="role" class="block font-bold">ROL TÉCNICO (*)</label>
      <p-select
        inputId="role"
        formControlName="role"
        [options]="rolesState().roles"
        optionLabel="name"
        optionValue="name"
        placeholder="Seleccione un rol"
        [loading]="rolesState().loading"
        [class.ng-invalid]="roleError()"
        [class.ng-dirty]="roleError()"
      />
      @if (roleError(); as message) {
        <small class="p-error block">{{ message }}</small>
      }
      <small class="block mt-1">Se registra un miembro con un rol por solicitud.</small>
    </div>

    <div class="flex justify-content-end gap-2 mt-3">
      <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true" type="button" (onClick)="onCancel()" />
      <p-button label="Registrar" icon="pi pi-check" type="submit" [disabled]="isSubmitting()" [loading]="isSubmitting()" />
    </div>
  </form>
</p-dialog>
