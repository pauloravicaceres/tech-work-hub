<p-dialog
  header="ASIGNAR ELEMENTO AL SPRINT"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '40rem' }"
  (onShow)="resetState()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (banner(); as current) {
      <p-message [severity]="current.severity" styleClass="mb-3">{{ current.message }}</p-message>
    }

    <div class="mb-3">
      <label class="block font-bold">SPRINT</label>
      <span>{{ sprintName() }} ({{ sprintId() }})</span>
    </div>

    <div class="p-fluid mb-3">
      <label for="itemId" class="block font-bold">IDENTIFICADOR DEL ELEMENTO DEL BACKLOG (*)</label>
      <input
        pInputText
        id="itemId"
        formControlName="itemId"
        placeholder="Ej: 7b1c2d3e-0000-4000-8000-000000000003"
        autocomplete="off"
        autofocus
        [class.ng-invalid]="fieldError()"
        [class.ng-dirty]="fieldError()"
      />
      @if (fieldError(); as message) {
        <small class="p-error block">{{ message }}</small>
      }
      <small class="block mt-1">Se asigna un elemento por solicitud.</small>
    </div>

    <div class="flex justify-content-end gap-2 mt-3">
      @if (sprintMissing()) {
        <p-button label="Volver al listado de Sprints" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" type="button" routerLink="/sprints" />
      } @else {
        <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true" type="button" (onClick)="onCancel()" />
      }
      <p-button label="Asignar" icon="pi pi-check" type="submit" [disabled]="isSubmitting() || sprintMissing()" [loading]="isSubmitting()" />
    </div>
  </form>
</p-dialog>
