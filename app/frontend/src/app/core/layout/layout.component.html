<div class="min-h-screen flex flex-col bg-surface-50 dark:bg-surface-900 text-color">
  <header>
    <p-menubar>
      <ng-template #start>
        <div class="flex items-center gap-2">
          <button
            #toggleButton
            pButton
            type="button"
            severity="secondary"
            [text]="true"
            [attr.aria-label]="texts.toggleNavAriaLabel"
            [attr.aria-expanded]="navOpen()"
            (click)="toggleNav()"
          >
            <i class="pi pi-bars"></i>
          </button>
          <span class="font-semibold text-lg">{{ texts.appName }}</span>
        </div>
      </ng-template>
      <ng-template #end>
        <div class="flex items-center gap-2">
          <p-button
            [icon]="theme.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
            severity="secondary"
            [text]="true"
            [ariaLabel]="theme.mode() === 'dark' ? texts.theme.toLight : texts.theme.toDark"
            (onClick)="onThemeToggle()"
          />
          <i class="pi pi-user"></i>
          <span>{{ userName() ?? texts.profileFallback }}</span>
          <p-button
            icon="pi pi-chevron-down"
            severity="secondary"
            [text]="true"
            [ariaLabel]="texts.profileMenuAriaLabel"
            (onClick)="profileMenu.toggle($event)"
          />
          <p-menu #profileMenu [model]="profileItems" [popup]="true" appendTo="body" />
        </div>
      </ng-template>
    </p-menubar>
  </header>

  <div class="flex flex-1">
    @if (viewport.isWide() && navOpen()) {
      <aside class="w-64 shrink-0 bg-surface-0 dark:bg-surface-800 border-surface-200 dark:border-surface-700">
        <nav class="h-full" [attr.aria-label]="texts.navAriaLabel">
          <p-menu [model]="navItems()" styleClass="w-full h-full" />
        </nav>
      </aside>
    }

    <div class="flex-1 min-w-0">
      <main class="max-w-7xl mx-auto p-6">
        @if (logoutFailed()) {
          <p-message severity="error">{{ texts.logoutError }}</p-message>
        }
        <router-outlet />
      </main>
    </div>
  </div>

  <footer class="p-4 text-center bg-surface-0 dark:bg-surface-800 border-t border-surface-200 dark:border-surface-700 text-muted-color">{{ texts.footer }}</footer>

  <div role="status" class="sr-only">{{ themeAnnouncement() }}</div>
</div>

@if (!viewport.isWide()) {
  <p-drawer [(visible)]="navOpen" [modal]="true" [dismissible]="true" (onShow)="onDrawerShow()" (onHide)="onDrawerHide()">
    <nav #drawerNav [attr.aria-label]="texts.navAriaLabel" (click)="closeNav()">
      <p-menu [model]="navItems()" styleClass="w-full" />
    </nav>
  </p-drawer>
}
