<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var mode = null;
      try {
        var stored = localStorage.getItem('app-theme-mode');
        if (stored === 'light' || stored === 'dark') mode = stored;
      } catch (e) {}
      if (mode === null) {
        mode = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.classList.toggle('app-dark', mode === 'dark');
      root.style.colorScheme = mode;
    })();
  </script>
  <title>TechWorkHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <app-root></app-root>
</body>
</html>
